<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - LAQ.Dev</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-page-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <!-- NAVEGACIÓN -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="text-decoration:none;">
                    <h1>LAQ.Dev</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#inicio" class="nav-link">Inicio</a></li>
                <li class="nav-dropdown">
                    <a href="#" class="nav-link dropdown-toggle">Documentación <i
                            class="fas fa-chevron-down nav-arrow"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="codigo-de-app.html"><i class="fas fa-code"></i> Código de App</a></li>
                        <li class="nested-dropdown">
                            <a href="politicas-de-app.html"><i class="fas fa-shield-alt"></i> Políticas de App <i
                                    class="fas fa-chevron-right nested-arrow"></i></a>
                            <ul class="nested-menu">
                                <li><a href="politica-tvstreaming.html" target="_blank" rel="noopener noreferrer"><i
                                            class="fas fa-tv"></i>
                                        TVStreaming</a></li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <main class="contact-page-container">
            <h1 style="color: var(--dark-color); margin-bottom: 10px; text-align:center;">📫 Contáctame</h1>
            <p class="contact-subtitle" style="text-align:center; color: #6b7280; margin-bottom: 30px;">
                ¿Tienes alguna pregunta? Envíame un mensaje.
            </p>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" required placeholder="Motivo de tu mensaje">
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required
                        placeholder="Escribe aquí tu mensaje..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Mensaje</button>
            </form>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portafolio de LAQ.Dev. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
